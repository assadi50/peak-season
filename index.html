c}.bar{height:10px;background:#e3eaec;border-radius:10px;overflow:hidden}.bar i{display:block;height:100%;background:#006682}.muted{color:#5f7480;font-size:13px}</style></head><body>\n  <div class="muted">مجموعة المعارف · المسار الأول · المحاكاة القيادية «موسم الذروة» · ${esc(S.team)}</div><h1>${esc(s)}</h1><div>${esc(a)} · متوسط الكفاءات المقاسة: <b>${e.avg}</b></div>\n  <h2>الكفاءات</h2><table>${COMPS.map((t=>`<tr><td>${t.n}</td><td style="width:45%">${null!=e.p[t.id]?`<div class="bar"><i style="width:${e.p[t.id]}%"></i></div>`:'<span class="muted">لم تُقَس</span>'}</td><td>${e.p[t.id]??""}</td></tr>`)).join("")}</table>\n  <h2>المساهمة في نتيجة الفريق</h2><p>القيادة ${sgn(e.con.L)} · الاستراتيجية ${sgn(e.con.S)} · الارتباط ${sgn(e.con.E)}</p>\n  <h2>القرارات وأثرها</h2><table>${e.items.map((t=>`<tr><td><b>${esc(t.title)}</b><br><span class="muted">${esc(t.note||"")}</span></td><td>${"LSE".split("").filter((e=>t.eff[e])).map((e=>`${PIL[e]} ${sgn(t.eff[e])}`)).join(" · ")}</td></tr>`)).join("")}</table>\n  ${e.low?`<h2>أولوية التطوير</h2><p><b>${e.low.n}</b>: ${LOWTIP[e.low.id]}<br><span class="muted">${e.low.day}</span></p>`:""}\n  <h2>الالتزام خلال 30 يوماً</h2><p>${esc($("#cmt")?$("#cmt").value:"")}</p><p class="muted">سيناريو وأرقام افتراضية لأغراض التدريب.</p></body></html>`}document.documentElement.lang="ar",hud(),dock(),renderBrief();
</script>
